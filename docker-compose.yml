services:
  pipeline:
    build:
      context: .
      args:
        NEXTCLADE_VERSION: "3.21.2"
        NEXTCLADE_DATASET_NAME: "nextstrain/sars-cov-2/wuhan-hu-1/orfs"
        NEXTCLADE_DATASET_TAG: "2026-04-21--09-39-50Z"
    image: sars2-bioinformatics:nextclade-3.21.2
    environment:
      NEXTCLADE_EXE: nextclade
      NEXTCLADE_DATASET: /opt/nextclade/datasets/sars-cov-2
      NEXTCLADE_DATASET_NAME: nextstrain/sars-cov-2/wuhan-hu-1/orfs
      NEXTCLADE_DATASET_TAG: 2026-04-21--09-39-50Z
      SARS2_PIPELINE_CONTAINER_IMAGE: sars2-bioinformatics:nextclade-3.21.2
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
      - ./reports:/app/reports
    command: ["bash", "-c", "/opt/venv/bin/python main.py && /opt/venv/bin/python scripts/generate_report.py"]
